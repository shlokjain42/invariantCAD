version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Give new releases a week for advisories and yanks, and stay clear of
    # pnpm's minimum release age, before proposing them.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # occt-wasm is pinned together with native/occt/upstream.lock.json and the
      # owned-facade patches. Upgrade it deliberately, not automatically.
      - dependency-name: occt-wasm

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
