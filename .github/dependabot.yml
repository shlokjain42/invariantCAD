version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Give new releases a week for advisories and yanks, and stay clear of
    # pnpm's minimum release age, before proposing them.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # occt-wasm is pinned together with native/occt/upstream.lock.json and the
      # owned-facade patches. Upgrade it deliberately, not automatically.
      - dependency-name: occt-wasm
      # tsup 9 requires Node ^22.18, ^24.11, or >=26, but the package and the
      # required CI job build on Node 22.13. Revisit when the floor rises.
      - dependency-name: tsup
        update-types: ["version-update:semver-major"]
      # mint 4.2.1157 pulled in advisories in adm-zip, axios, fflate,
      # image-size, js-yaml, and re2js that the dependency audit rejects.
      # Upgrade the docs CLI deliberately once its tree is clean.
      - dependency-name: mint

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
