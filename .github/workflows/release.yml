name: Publish npm

# Every push to main is checked for a release: a push whose package.json
# version differs from the version main had before the push. That only happens
# when a release pull request prepared by .github/workflows/prepare-release.yml
# merges, by merge commit, squash, or rebase.
#
# A release commit then runs the full acceptance suite, publishes the exact
# smoke-tested tarball to npm through trusted publishing after approval in the
# `npm` environment, confirms that the registry holds those bytes, creates the
# annotated vX.Y.Z tag and GitHub release, and advances the docs-live branch
# that the hosted documentation deploys from.
#
# The npm trusted publisher is bound to this workflow filename and the `npm`
# environment; renaming either breaks publication. Every step is idempotent.
# Recover a partial release by re-running the original push run, which keeps
# the release commit and its pre-push base; there is deliberately no manual
# trigger that could release a later main commit under the same version.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    name: Detect release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Compare the package version with main before this push
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases run only from main, not $GITHUB_REF."
            exit 1
          fi
          version_at() {
            git show "$1:package.json" |
              node -e 'let s="";process.stdin.on("data",(c)=>s+=c).on("end",()=>process.stdout.write(JSON.parse(s).version))'
          }
          # A rebase-merged release pull request pushes several commits at once,
          # so compare against main before the whole push, not HEAD's parent.
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "::error::This push has no previous main commit to compare with."
            exit 1
          fi
          base="$BEFORE"
          version="$(version_at HEAD)"
          previous="$(version_at "$base")"
          echo "Comparing package.json at ${GITHUB_SHA} (${version}) with ${base} (${previous})."
          tag="v${version}"
          tag_commit="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          published="$(npm view "invariantcad@${version}" version 2>/dev/null || true)"
          github_release=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            github_release=true
          fi
          docs_live=false
          if git fetch --no-tags origin "+refs/heads/docs-live:refs/remotes/origin/docs-live" 2>/dev/null &&
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/docs-live; then
            docs_live=true
          fi

          release=false
          if [[ "$version" == "$previous" ]]; then
            echo "package.json stays at ${version}; this commit is not a release."
          elif [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::${tag} already points at ${tag_commit}, not ${GITHUB_SHA}."
            exit 1
          elif [[ "$published" == "$version" && -n "$tag_commit" && "$github_release" == "true" && "$docs_live" == "true" ]]; then
            echo "invariantcad@${version}, ${tag}, its GitHub release, and docs-live are complete; nothing to resume."
          else
            release=true
            echo "Releasing invariantcad ${version} (previous ${previous})."
          fi
          {
            echo "release=${release}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Release acceptance
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check release metadata
        run: pnpm exec tsx scripts/release.ts check "$VERSION"

      - name: Run release acceptance suite
        run: pnpm release:check

      - name: Stage the smoke-tested tarball and release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/release
          cp ".artifacts/invariantcad-${VERSION}.tgz" .artifacts/release/
          pnpm exec tsx scripts/release.ts notes "$VERSION" > .artifacts/release/notes.md

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: invariantcad-npm-publish
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}

    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.0.1

      - name: Publish the verified tarball through npm trusted publishing
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(npm view "invariantcad@${VERSION}" version 2>/dev/null || true)" == "$VERSION" ]]; then
            echo "invariantcad@${VERSION} is already on npm; continuing to the GitHub release."
            echo "published=earlier" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Publishing an older version after a newer one would move npm's
          # `latest` dist-tag backwards, so a stale release stops here.
          newer="$(npm view invariantcad versions --json | node -e '
            let text = "";
            process.stdin.on("data", (chunk) => (text += chunk)).on("end", () => {
              const parts = (value) => value.split(".").map(Number);
              const newer = (left, right) => {
                const [a, b] = [parts(left), parts(right)];
                for (let index = 0; index < 3; index += 1) {
                  if (a[index] !== b[index]) return a[index] > b[index];
                }
                return false;
              };
              const versions = [].concat(JSON.parse(text));
              process.stdout.write(
                versions.filter((value) => /^\d+\.\d+\.\d+$/.test(value) && newer(value, process.argv[1])).join(" "),
              );
            });
          ' "$VERSION")"
          if [[ -n "$newer" ]]; then
            echo "::error::npm already has newer invariantcad ${newer}; refusing to publish stale ${VERSION}."
            exit 1
          fi
          npm publish "./release/invariantcad-${VERSION}.tgz" --access public --provenance
          echo "published=now" >> "$GITHUB_OUTPUT"

  github-release:
    name: Tag, GitHub release, and live docs
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: invariantcad-npm-publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISHED: ${{ needs.publish.outputs.published }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Confirm npm holds this commit's verified package
        shell: bash
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/release/invariantcad-${VERSION}.tgz"
          expected="$(node -e 'const {createHash}=require("node:crypto");process.stdout.write("sha512-"+createHash("sha512").update(require("node:fs").readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
          # npm's SLSA provenance names the repository, workflow, and commit that
          # published the version. Require this commit, whether this attempt or
          # an earlier one published it.
          wanted="https://github.com/${GITHUB_REPOSITORY} .github/workflows/release.yml ${GITHUB_SHA}"
          provenance=""
          actual=""
          for attempt in $(seq 1 20); do
            provenance="$(curl -fsS "https://registry.npmjs.org/-/npm/v1/attestations/invariantcad@${VERSION}" 2>/dev/null | node -e '
              let text = "";
              process.stdin.on("data", (chunk) => (text += chunk)).on("end", () => {
                for (const attestation of JSON.parse(text).attestations ?? []) {
                  if (!attestation.predicateType.startsWith("https://slsa.dev/provenance/")) continue;
                  const statement = JSON.parse(
                    Buffer.from(attestation.bundle.dsseEnvelope.payload, "base64").toString("utf8"),
                  );
                  const build = statement.predicate.buildDefinition;
                  const workflow = build.externalParameters.workflow;
                  const commit = (build.resolvedDependencies ?? [])
                    .map((dependency) => dependency.digest?.gitCommit)
                    .find(Boolean);
                  process.stdout.write(`${workflow.repository} ${workflow.path} ${commit}`);
                }
              });
            ' || true)"
            actual="$(npm view "invariantcad@${VERSION}" dist.integrity 2>/dev/null || true)"
            if [[ "$provenance" == "$wanted" ]]; then
              if [[ "$actual" == "$expected" ]]; then
                echo "npm serves this commit's smoke-tested invariantcad-${VERSION}.tgz (${expected})."
                exit 0
              fi
              if [[ "$PUBLISHED" != "now" ]]; then
                # A re-run rebuilds the tarball; provenance already binds the
                # registry package to this commit and workflow.
                echo "::notice::invariantcad@${VERSION} was published from ${GITHUB_SHA} by an earlier attempt (${actual}); this attempt rebuilt ${expected}."
                exit 0
              fi
            elif [[ -n "$provenance" ]]; then
              echo "::error::invariantcad@${VERSION} provenance is '${provenance}', expected '${wanted}'."
              exit 1
            fi
            echo "Waiting for the registry (attempt ${attempt}): provenance '${provenance}', integrity '${actual}'"
            sleep 15
          done
          echo "::error::npm did not report this commit's verified package: provenance '${provenance}', integrity '${actual}', expected '${wanted}' and '${expected}'."
          exit 1

      - name: Create the annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          existing="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$GITHUB_SHA" || "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
              echo "::error::${tag} exists but is not an annotated tag on ${GITHUB_SHA}."
              exit 1
            fi
            echo "${tag} already exists on ${GITHUB_SHA}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "InvariantCAD ${VERSION}" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"

      - name: Publish the GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "The ${tag} GitHub release already exists."
            exit 0
          fi
          # Only the highest stable tag may become the latest GitHub release.
          git fetch --tags --force origin
          highest="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          latest=false
          if [[ "$highest" == "$tag" ]]; then latest=true; fi
          gh release create "$tag" --verify-tag --latest="$latest" \
            --title "InvariantCAD ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/release/notes.md"

      - name: Advance the live documentation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/docs-live:refs/remotes/origin/docs-live"
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/docs-live; then
            # Already live, or a newer release has advanced it; never move docs backwards.
            echo "docs-live already contains ${GITHUB_SHA}."
            exit 0
          fi
          if ! git merge-base --is-ancestor refs/remotes/origin/docs-live "$GITHUB_SHA"; then
            echo "::error::docs-live is not an ancestor of ${GITHUB_SHA}; refusing a non-fast-forward update."
            exit 1
          fi
          git push origin "${GITHUB_SHA}:refs/heads/docs-live"
